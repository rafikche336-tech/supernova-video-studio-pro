version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Framework upgrades land together and get reviewed as one unit.
      next:
        patterns:
          - next
          - eslint-config-next
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
    ignore:
      # Majors need a human: they change rendering semantics.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github actions
    directory: /
    schedule:
      interval: monthly
